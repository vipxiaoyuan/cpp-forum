<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>发帖 - C++论坛</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a href="/" class="back">← 返回首页</a>
<form method="post">
    <h2>发布帖子</h2>
    <label>昵称</label>
    <input type="text" name="author" required>
    <label>标题</label>
    <input type="text" name="title" required>
    <label>内容（可以贴C++代码）</label>
    <textarea name="content" required></textarea>
    <button type="submit">提交发帖</button>
</form>
</body>
</html>
